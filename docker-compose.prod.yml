services:
  blinko-website:
    # Pulls the image CI builds & pushes to GHCR on every push to main.
    # Make sure the GHCR package is public, or run `docker login ghcr.io`
    # on the VPS once with a PAT that has read:packages.
    image: ghcr.io/bafsr03/bouldhq:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: https://hq.bouldhq.com
      NEXTAUTH_SECRET: my_ultra_secure_nextauth_secret
      # Talks to the postgres service below over the compose network.
      DATABASE_URL: postgresql://postgres:mysecretpassword@postgres:5432/postgres
      # Behind Caddy → trust the proxy so real client IPs are honoured.
      TRUST_PROXY: "1"
      # Owner's Claude Code OAuth token — read from host env / .env on the VPS.
      # Generate with `claude setup-token` then export it (or put it in .env).
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    # No public port — Caddy reaches it internally on the compose network.
    expose:
      - "1111"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1111/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - blinko-website
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist issued certs so we don't re-request on every restart
      # (Let's Encrypt rate-limits aggressively).
      - caddy_data:/data
      - caddy_config:/config

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    # Persist data across container restarts / image updates.
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not exposed publicly — only the app container reaches it over the
    # compose network. Uncomment to connect a local client for migrations/dumps.
    # ports:
    #   - 5435:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 10s
      retries: 5

volumes:
  pgdata:
  caddy_data:
  caddy_config:
